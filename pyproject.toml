[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pylcss"
version = "3.0.0"
description = "Source-available desktop engineering design, simulation, sensitivity, and optimization workbench"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "PolyForm Shield License 1.0.0"}
authors = [
    {name = "Kutay Demir"}
]
keywords = [
    "engineering",
    "optimization",
    "parametric-design",
    "design-studio",
    "simulation",
    "CAD",
    "FEA",
    "CalculiX",
    "OpenCourant",
    "topology-optimization",
    "sensitivity-analysis",
    "surrogate-modeling",
    "solution-space",
    "NSGA-II",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.2",
    "pandas==2.2.2",
    "PySide6==6.10.1",
    "NodeGraphQt==0.6.43",
    "pyqtgraph==0.14.0",
    "QtAwesome==1.3.1",
    "pint==0.25.2",
    "h5py==3.11.0",
    "dill==0.4.1",
    "networkx==3.3",
    "packaging==26.0",
    "simpleeval==1.0.3",
]

[project.scripts]
pylcss = "pylcss.main:main"

[project.optional-dependencies]
mdao = [
    "nevergrad==1.0.4",
    "SALib==1.5.2",
    "torch==2.9.1",
    "scikit-learn==1.8.0",
    "hdbscan==0.8.41",
    "joblib==1.5.3",
    "openpyxl==3.1.5",
]
cae = [
    "geomdl==5.4.0",
    "cadquery==2.6.1",
    "vtk==9.3.1",
    "scikit-fem==11.0.0",
    "netgen-mesher==6.2.2506",
    "meshio==5.3.5",
    "scikit-image==0.26.0",
    "numpy-stl==3.2.0",
    "trimesh==4.5.3",
    "lxml==5.3.0",
    "fast-simplification==0.1.13",
    "rtree==1.4.1",
    "pymoto==2.0.1",
    "py7zr==0.20.8",
    "numba==0.63.1",
    "pymeshlab==2025.7.post1",
    "threadpoolctl==3.6.0",
]
all = ["pylcss[mdao,cae]"]


[tool.setuptools.packages.find]
where = ["."]
include = ["pylcss*"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'

[tool.setuptools.package-data]
"pylcss.user_interface" = ["*.png", "*.pdf"]
"pylcss.cae.design_studio.freecad_bridge" = ["macros/*.FCMacro"]
